<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <!-- CDN modules for the 3D islands and motion. Must come before any module script. -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
      "three": "https://esm.sh/three@0.169.0",
      "three/addons/": "https://esm.sh/three@0.169.0/examples/jsm/",
      "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.17.10?external=react,react-dom,three",
      "htm": "https://esm.sh/htm@3.1.1",
      "gsap": "https://esm.sh/gsap@3.13.0",
      "gsap/ScrollTrigger": "https://esm.sh/gsap@3.13.0/ScrollTrigger"
    }
  }
  </script>
  <script src="config.js"></script>
  <title>Terra — Build the roads. Teach the cars.</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Build a virtual Brisbane, then watch self-driving cars, ships and planes learn the routes you charted. A logistics strategy sim with live dashboards and an idle depot.">
  <meta name="theme-color" content="#24201A">
  <meta name="color-scheme" content="dark light">
  <meta property="og:title" content="Terra — Build the roads. Teach the cars.">
  <meta property="og:description" content="A comic-book logistics sim for Brisbane: self-driving cars, ships and planes that learn.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://esm.sh" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Bangers&family=JetBrains+Mono:wght@500;700&display=swap">
  <script>
    // Apply the saved theme before first paint (no flash of the wrong colours).
    try {
      var css = localStorage.getItem('terra.theme.css');
      var mode = localStorage.getItem('terra.theme.mode');
      if (css) document.documentElement.style.cssText = css;
      if (mode) {
        document.documentElement.dataset.mode = mode;
        document.documentElement.style.colorScheme = mode;
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root>
    <div class="boot" role="status">
      <span class="boot__mark" aria-hidden="true">T</span>
      <span>Loading Terra…</span>
    </div>
  </app-root>
  <noscript>Terra is an interactive simulation and needs JavaScript enabled.</noscript>
</body>
</html>
