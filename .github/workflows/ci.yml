name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (engine + Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Engine tests (self-driving, geo, logistics, economy)
        run: npm run test:engine
      - name: Angular unit tests (Vitest)
        run: npx ng test --watch=false
      - name: Production build
        run: npx ng build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/web/browser
          retention-days: 7

  api:
    name: API (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore api/Terra.sln
      - run: dotnet build api/Terra.sln --no-restore -c Release -warnaserror
      - name: Tests (includes JS ⇄ C# parity)
        run: dotnet test api/Terra.sln --no-build -c Release --logger "trx;LogFileName=results.trx" --collect:"XPlat Code Coverage"
      - name: Migrations are up to date with the model
        run: |
          cd api
          dotnet tool restore
          dotnet tool run dotnet-ef migrations has-pending-model-changes --project Terra.Api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: api/Terra.Api.Tests/TestResults

  functions:
    name: Serverless (Azure Functions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  wordpress:
    name: WordPress plugin (PHP lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: none
      - run: find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: sh -n wordpress/setup.sh

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  e2e:
    name: End-to-end (Playwright)
    needs: [web, api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist/web/browser
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  trainer:
    name: Terra Trainer (C++ sim + PyTorch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trainer/py/requirements.txt
      - name: Python packages (CPU-only PyTorch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r trainer/py/requirements.txt
      - name: Fresh parity fixtures and worlds from the JS engine
        run: |
          node tools/car-parity-fixtures.mjs
          node tools/export-trainer-worlds.mjs
      - name: Build the C++ library and Python module
        run: |
          cmake -S trainer/sim-cpp -B trainer/sim-cpp/build -DCMAKE_BUILD_TYPE=Release -DTERRA_BUILD_PYTHON=ON -DPython_EXECUTABLE="$(which python)"
          cmake --build trainer/sim-cpp/build -j
      - name: C++ unit tests + JS ⇄ C++ parity
        run: ctest --test-dir trainer/sim-cpp/build --output-on-failure
      - name: Python tests (binding, export validation, ES / CMA-ES smoke)
        working-directory: trainer/py
        run: python -m pytest -q
      - name: Smoke training runs + analysis
        working-directory: trainer/py
        run: |
          python -m terra_trainer.es --generations 6 --population 16 --maps brisbane --out ../runs/ci/cmaes
          python -m terra_trainer.ppo --updates 2 --cars 64 --horizon 32 --maps brisbane --out ../runs/ci/ppo
          node ../../tools/ga-baseline.mjs --generations 2 --population 8 --out trainer/runs/ci/browser-ga
          python -m terra_trainer.analyze ../runs/ci --out ../runs/ci/report
      - uses: actions/upload-artifact@v4
        with:
          name: trainer-smoke
          path: trainer/runs/ci
          retention-days: 7

  docker:
    name: Container images
    needs: [web, api]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, web, functions]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: false
          tags: terra-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
